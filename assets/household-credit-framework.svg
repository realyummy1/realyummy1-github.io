<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Public insurance, borrower regulation, and household credit</title>
  <desc id="desc">Conceptual overview of panel evidence from 20 European countries between 2000 and 2019. Public insurance and recorded borrower regulation provide the institutional context for studying the relationship between household credit and saving. The evidence is associational.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#8a9199" stroke-width="1.4"/></marker>
    <style>.sans{font-family:Arial,Helvetica,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.label{font-size:19px;font-weight:700;letter-spacing:1px}.body{font-size:18px;fill:#545960}.icon{fill:none;stroke:#465362;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>
  <rect width="960" height="560" fill="#fff"/>
  <text x="34" y="43" class="sans label" fill="#c41e3a">HOUSEHOLD FINANCE &amp; PUBLIC INSTITUTIONS</text>
  <text x="34" y="82" class="serif" font-size="29" fill="#171717">Credit and saving in European welfare states</text>
  <path d="M34 103H926" stroke="#d9dde1"/>

